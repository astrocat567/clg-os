<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>clg os</title>
<style>
:root{--g:rgba(245,247,252,.82);--w:#f8fafc;--t:#0f172a;--b:rgba(0,0,0,.13);--h:rgba(0,0,0,.07);--a:#3b82f6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--g:rgba(22,26,38,.82);--w:#161a26;--t:#f1f5f9;--b:rgba(255,255,255,.14);--h:rgba(255,255,255,.09);--a:#4f8cff;color-scheme:dark}}
:root[data-theme=dark]{--g:rgba(22,26,38,.82);--w:#161a26;--t:#f1f5f9;--b:rgba(255,255,255,.14);--h:rgba(255,255,255,.09);--a:#4f8cff;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:#0b1020;color:var(--t);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:var(--t);-webkit-user-select:text;user-select:text}
small{opacity:.7}
#os{position:relative;height:100%;overflow:hidden}
#wall,#desk,#scrim{position:absolute;inset:0}
#wall{background:#203a43 center/cover}
#desk,#scrim{bottom:48px}
#scrim{display:none;z-index:8400}
#bar{position:absolute;left:0;right:0;bottom:0;height:48px;z-index:9000;display:flex;align-items:center;gap:6px;padding:0 8px;background:var(--g);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--b)}
#bar button{height:38px;border:0;border-radius:8px;background:none}
#bar button:hover{background:var(--h)}
#st{display:flex;align-items:center;gap:6px;padding:0 12px;font-weight:700}
#st span{color:var(--a);font-size:18px}
#tasks{flex:1;min-width:0;display:flex;gap:4px;overflow:hidden}
#bar .tk{display:flex;align-items:center;gap:6px;max-width:150px;padding:0 10px;border-bottom:2px solid transparent}
#bar .tk.on{background:var(--h);border-bottom-color:var(--a)}
#bar .tk.run{border-bottom-color:var(--b)}
.tk span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#clk{display:flex;flex-direction:column;line-height:1.15;text-align:right;padding:0 8px}
#bar #sd{width:10px;padding:0;border-radius:0;border-left:1px solid var(--b)}
.win{position:absolute;min-width:200px;min-height:120px;display:flex;flex-direction:column;background:var(--w);border:1px solid var(--b);border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.4);overflow:hidden}
.win.on{box-shadow:0 14px 56px rgba(0,0,0,.6)}
.win.max{inset:0!important;width:auto!important;height:auto!important;border:0;border-radius:0}
.win.min{display:none}
.tb{flex:none;display:flex;align-items:center;gap:8px;height:36px;padding:0 4px 0 10px;background:var(--g);touch-action:none}
.tb b{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb button{width:34px;height:28px;border:0;border-radius:6px;background:none}
.tb button:hover{background:var(--h)}
.tb .x:hover{background:#e5484d;color:#fff}
.bd{position:relative;flex:1;min-height:0}
.bd iframe{display:block;width:100%;height:100%;border:0;background:#fff}
.shield{position:absolute;inset:0;z-index:2}
.win.on .shield{display:none}
#os.drag .shield{display:block!important}
.rs{position:absolute;z-index:3;touch-action:none}
.win.max .rs{display:none}
[data-d=n],[data-d=s]{left:10px;right:10px;height:6px;cursor:ns-resize}
[data-d=e],[data-d=w]{top:10px;bottom:10px;width:6px;cursor:ew-resize}
[data-d=n]{top:0}[data-d=s]{bottom:0}[data-d=e]{right:0}[data-d=w]{left:0}
[data-d=ne],[data-d=nw],[data-d=se],[data-d=sw]{width:12px;height:12px}
[data-d=ne]{top:0;right:0;cursor:nesw-resize}[data-d=sw]{bottom:0;left:0;cursor:nesw-resize}
[data-d=nw]{top:0;left:0;cursor:nwse-resize}[data-d=se]{bottom:0;right:0;cursor:nwse-resize}
.panel{position:absolute;bottom:56px;z-index:8500;padding:12px;background:var(--g);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);border:1px solid var(--b);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.35);opacity:0;pointer-events:none;transform:translateY(10px);transition:opacity .15s,transform .15s}
.panel.show{opacity:1;pointer-events:auto;transform:none}
#drw{left:8px;width:min(560px,calc(100% - 16px));max-height:72%;display:flex;flex-direction:column}
#wdg,#ntf,#clp{right:8px;width:min(340px,calc(100% - 16px));max-height:calc(100% - 64px);overflow:auto}
#q{width:100%;padding:9px 12px;border:1px solid var(--b);border-radius:10px;background:var(--h)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:4px;margin-top:10px;overflow:auto}
.ap{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border:0;border-radius:10px;background:none}
.ap:hover{background:var(--h)}
.ap span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.ic{display:grid;place-items:center;flex:none;overflow:hidden;color:#fff}
.ic img{width:100%;height:100%;object-fit:cover}
.card{padding:12px;margin-bottom:10px;border-radius:12px;background:var(--h)}
.card:last-child{margin-bottom:0}
.card input{flex:1;min-width:0;padding:7px 9px;border:1px solid var(--b);border-radius:8px;background:var(--w)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
.pb{padding:7px 12px;border:0;border-radius:8px;background:var(--a);color:#fff}
#wt,#wt2{font-size:40px;font-weight:300;line-height:1.1}
.big{font-size:28px}
.rem{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--b)}
.rem small{display:block}
.rem.done b{text-decoration:line-through;opacity:.5}
.del{border:0;background:none;padding:4px 8px}
#toasts{position:absolute;right:12px;top:12px;z-index:9500;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:10px 14px;border-radius:10px;background:var(--g);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--b);box-shadow:0 8px 24px rgba(0,0,0,.3);animation:in .2s}
@keyframes in{from{opacity:0;transform:translateY(-8px)}}
.set{position:absolute;inset:0;overflow:auto;padding:16px;background:var(--w);-webkit-user-select:text;user-select:text}
.set h3{margin:18px 0 6px;font-size:15px}.set h3:first-child{margin-top:0}
.set p{margin:4px 0 8px;opacity:.8}
.wps{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
.wp{height:56px;border:2px solid transparent;border-radius:8px}
.wp:hover{border-color:var(--a)}
#icons,#wl{position:absolute;inset:0 0 48px 0;pointer-events:none}
#icons{z-index:1;padding:10px;display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,96px);grid-auto-columns:92px;align-content:start;justify-content:start}
#wl{z-index:2}
.di{pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border:0;border-radius:10px;background:none;color:#fff;font-size:12px;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.di:hover{background:rgba(255,255,255,.18)}
.di span:last-child{max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card{position:relative}
.dw{position:absolute;width:260px;margin:0;pointer-events:auto;touch-action:none;cursor:grab;background:var(--g);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--b);box-shadow:0 8px 28px rgba(0,0,0,.35)}
.wpin{position:absolute;top:6px;right:6px;border:0;background:none;font-size:12px;opacity:.45}
.wpin:hover,.dw .wpin{opacity:1}
textarea,select{font:inherit;color:var(--t);-webkit-user-select:text;user-select:text}
.card textarea{display:block;width:100%;height:80px;margin-top:6px;padding:7px 9px;resize:vertical;border:1px solid var(--b);border-radius:8px;background:var(--w)}
select{padding:7px 9px;border:1px solid var(--b);border-radius:8px;background:var(--w)}
#nb{position:relative}
#bd{display:none;position:absolute;top:1px;right:1px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:#e5484d;color:#fff;font-size:10px;line-height:16px;text-align:center}
#cm{position:fixed;display:none;z-index:9800;min-width:190px;padding:6px;background:var(--g);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--b);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#cm button{display:block;width:100%;padding:8px 10px;border:0;border-radius:6px;background:none;text-align:left}
#cm button:hover{background:var(--h)}
.toast{display:flex;align-items:flex-start;gap:10px;width:min(300px,calc(100vw - 24px));pointer-events:auto;border-left:4px solid var(--a)}
.toast.rem{border-left-color:#f59e0b}
.te{font-size:20px}
.tx{flex:1;min-width:0}
.tx small{display:block;overflow-wrap:anywhere}
.tx .pb{display:block;margin-top:6px}
.sr{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 8px;padding:4px 0}
.sr i{flex:0 0 100%;position:relative;height:4px;border-radius:2px;background:var(--b);overflow:hidden}
.sr i::after{content:'';position:absolute;inset:0 auto 0 0;width:var(--p);background:var(--a)}
@media(max-width:600px){.tk:not(.pin) span:last-child,#dd{display:none}}
#icons{display:block;padding:0}
.di{position:absolute;width:88px;touch-action:none}.di.mv{opacity:.7;z-index:5}
#hud{position:absolute;left:8px;top:8px;z-index:9400;display:none;padding:6px 10px;border-radius:8px;background:rgba(0,0,0,.72);color:#7cffa1;font:11px/1.5 ui-monospace,Consolas,monospace;white-space:pre;pointer-events:none}
#dlg{position:absolute;inset:0;z-index:9700;display:none;place-items:center;background:rgba(0,0,0,.4)}
#dlg>div{width:min(380px,calc(100% - 24px));padding:16px;border-radius:12px;background:var(--w);border:1px solid var(--b);box-shadow:0 12px 40px rgba(0,0,0,.5)}
#dlg input,.set input:not([type=checkbox]),.s10 .sch{display:block;width:100%;margin:8px 0;padding:8px 10px;border:1px solid var(--b);border-radius:8px;background:var(--w)}
.set .row input{width:auto;margin:0}
.tf{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.tf:empty{display:none}
.tf button{padding:3px 10px;border:1px solid var(--b);border-radius:12px;background:none}.tf .on{background:var(--a);border-color:var(--a);color:#fff}
.tg{display:inline-block;margin:2px 4px 0 0;padding:0 8px;border-radius:10px;background:var(--a);color:#fff;font-size:11px}
.sr b{text-align:right;overflow-wrap:anywhere}
.lg{padding:3px 6px;border-bottom:1px solid var(--b);font:12px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
.lg.warn{color:#d97706}.lg.error{color:#e5484d}.lg.info{color:var(--a)}
.s10{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--w);container-type:inline-size;-webkit-user-select:text;user-select:text}
.s10 .hd{display:flex;align-items:center;gap:8px;padding:8px 12px}.s10 .hd b{font-weight:400}
.s10 .bk{width:34px;height:34px;border:0;border-radius:50%;background:none;font-size:18px}.s10 .bk:hover,.s10 .nv button:hover,.s10 .tl button:hover{background:var(--h)}
.s10 .ct{flex:1;min-height:0;display:flex}
.s10 .nv{flex:0 0 200px;overflow:auto;border-right:1px solid var(--b)}
.s10 .nv button{display:block;width:100%;padding:11px 16px;border:0;border-left:3px solid transparent;background:none;text-align:left}.s10 .nv .on{border-left-color:var(--a);background:var(--h)}
.s10 .pg{flex:1;min-width:0;overflow:auto;padding:8px 28px 28px}
.s10 h2{margin:8px 0 14px;font-size:26px;font-weight:300}.s10 h4{margin:20px 0 8px;font-size:15px;font-weight:600}
.s10 .sch{max-width:420px;margin:6px 16px 10px;border:2px solid var(--b);border-radius:0}.s10 .sch:focus{outline:0;border-color:var(--a)}
.s10 .tl{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px;padding:0 16px 16px}
.s10 .tl button{display:flex;gap:14px;align-items:center;padding:14px;border:0;background:none;text-align:left}.s10 .tl em{font-size:30px;font-style:normal}.s10 .tl small{display:block}
.s10 .pb{padding:7px 14px;border:2px solid transparent;border-radius:0;background:var(--h);color:var(--t)}.s10 .pb:hover{border-color:var(--b)}.s10 .pb.p{background:var(--a);color:#fff}
.sw{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:8px 0}.sw small{display:block}
.s10 input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:none;position:relative;width:40px;height:20px;margin:0;border:2px solid var(--t);border-radius:10px;background:none;cursor:pointer}
.s10 input[type=checkbox]::after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--t);transition:left .15s}
.s10 input[type=checkbox]:checked{background:var(--a);border-color:var(--a)}.s10 input[type=checkbox]:checked::after{left:22px;background:#fff}
.s10 .wp{width:100%;height:68px;border-radius:0}.s10 .wp.on{border-color:var(--a)}.wpw{position:relative}
.wx{position:absolute;top:4px;right:4px;width:20px;height:20px;padding:0;border:0;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:10px}
.ac{width:36px;height:36px;border:2px solid transparent;border-radius:0}.ac.on{border-color:var(--t)}
@container (max-width:600px){.s10 .ct{flex-direction:column}.s10 .nv{flex:none;display:flex;overflow:auto;border:0;border-bottom:1px solid var(--b)}.s10 .nv button{width:auto;white-space:nowrap;border-left:0;border-bottom:3px solid transparent}.s10 .nv .on{border-bottom-color:var(--a)}.s10 .pg{padding:8px 14px 20px}}
#os.fm #bar{display:none}
#os.fm #desk,#os.fm #scrim,#os.fm #icons,#os.fm #wl{bottom:0}
#os.fm .win.on .tb{display:none}
#fx{position:absolute;left:50%;bottom:0;transform:translateX(-50%);z-index:9100;display:none;width:72px;height:16px;padding:0;border:0;background:none;opacity:.5}
#fx::after{content:'';display:block;margin:6px auto 0;width:44px;height:4px;border-radius:2px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
#fx:hover{opacity:1}#os.fm #fx{display:block}
.card[data-w]{border-radius:var(--cr,12px);color:var(--cfg,inherit);background:var(--cbg,var(--h))}
.card[data-w]>*:not(.wpin){zoom:var(--ws,1)}
.dw[data-w]{width:var(--ww,260px);background:var(--cbg,var(--g));-webkit-backdrop-filter:blur(var(--cbl,18px));backdrop-filter:blur(var(--cbl,18px))}
.dw.lk{cursor:default}
.s10 input[type=range]{width:min(220px,45%);accent-color:var(--a)}
.s10 input[type=color]{width:44px;height:30px;padding:0;border:0;background:none}
.s10 select{padding:6px 8px;border:2px solid var(--b);border-radius:0;background:var(--w);color:var(--t)}
.ldm{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;padding:20px;text-align:center;background:var(--w);color:var(--t)}
</style>
</head>
<body>
<div id="os">
 <div id="wall"></div>
 <div id="desk"></div>
 <div id="icons"></div>
 <div id="wl"></div>
 <div id="hud"></div>
 <div id="scrim"></div>
 <div id="drw" class="panel"><input id="q" placeholder="Search apps…" autocomplete="off"><div id="tf" class="tf"></div><div id="grid"></div><small style="margin-top:8px">Right-click or long-press an app to pin it or add tags.</small></div>
 <div id="clp" class="panel"><div class="card"><div id="wt2"></div><div id="wd2"></div></div><div class="card"><b>Weather</b><div id="wo2"></div></div><div class="card"><b>System</b><div id="sy2"></div></div></div>
 <div id="ntf" class="panel"><div class="row"><b style="flex:1">Notifications</b><button class="pb" id="dn" title="Do not disturb">🔔</button><button class="pb" id="nx">Clear</button></div><div id="nl"></div></div>
 <div id="wdg" class="panel">
  <div class="card" data-w="clock"><div id="wt"></div><div id="wd"></div></div>
  <div class="card" data-w="weather"><div class="row" style="margin-right:20px"><b style="flex:1">Weather</b><input id="wi" placeholder="City" style="max-width:130px"></div><div id="wo"></div></div>
  <div class="card" data-w="rem"><b>Reminders</b><div class="row"><input id="rt" placeholder="Remind me to…"></div><div class="row"><input id="rd" type="datetime-local"><button class="pb" id="ra">Add</button></div><div id="rl"></div></div>
  <div class="card" data-w="note"><b>Sticky note</b><textarea id="qn" placeholder="Jot something down…"></textarea></div>
  <div class="card" data-w="sys"><b>System</b><div id="sy"></div></div>
 </div>
 <div id="bar">
  <button id="st"><span>❖</span> clg os</button>
  <div id="tasks"></div>
  <button id="wb" title="Widgets">▦</button>
  <button id="nb" title="Notifications"><span id="bi">🔔</span><span id="bd"></span></button>
  <button id="th" title="Switch light/dark mode">◐</button>
  <button id="clk"><b id="tt"></b><small id="dd"></small></button>
  <button id="sd" title="Show desktop"></button>
 </div>
 <div id="dlg"></div>
 <button id="fx"></button>
 <div id="toasts"></div>
 <div id="cm"></div>
</div>
<input type="file" id="fi" webkitdirectory multiple hidden>
<input type="file" id="fw" accept="image/*" multiple hidden>
<input type="file" id="fc" accept=".json,application/json" hidden>
<script>
const $=s=>document.querySelector(s),
E=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e},
esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),
ld=(k,d)=>{try{const v=localStorage.getItem('clg.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
sv=(k,v)=>{try{localStorage.setItem('clg.'+k,JSON.stringify(v))}catch(e){}},
rd=(f,m)=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r['readAs'+(m||'DataURL')](f)}),
WP=['linear-gradient(135deg,#0f2027,#203a43,#2c5364)','linear-gradient(135deg,#654ea3,#eaafc8)','linear-gradient(160deg,#141e30,#243b55)','linear-gradient(135deg,#f12711,#f5af19)','linear-gradient(135deg,#134e5e,#71b280)','radial-gradient(circle at 30% 20%,#3a1c71,#d76d77 60%,#ffaf7b)','linear-gradient(180deg,#0000ff,#000)'],
S={wall:ld('wall',0),max:ld('max',true),city:ld('city','London'),geo:ld('geo',null),cc:ld('cc',true)},
P={drw:$('#drw'),wdg:$('#wdg'),ntf:$('#ntf'),clp:$('#clp')};
let R=ld('rem',[]),wins=[],act=null,Z=10,ext=[],apps=[];

/* ---------- storage for loaded apps ---------- */
const DB=new Promise((ok,no)=>{try{const r=indexedDB.open('clgos',1);r.onupgradeneeded=()=>r.result.createObjectStore('s');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}}),
idb=(m,...a)=>DB.then(d=>new Promise((ok,no)=>{const q=d.transaction('s',m=='get'?'readonly':'readwrite').objectStore('s')[m](...a);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)}));
DB.catch(()=>{});

/* ---------- helpers ---------- */
let N=ld('nt',[]),DND=ld('dnd',false),TH=ld('theme','auto'),PIN=ld('pins',{d:[],b:[]}),WD=ld('wd',{});
/* ---------- v2: debug, specs, tags, movable icons ---------- */
const VER='2.4';
let DBG=ld('dbg',false),HUD=ld('hud',false),TG=ld('tags',{}),DP=ld('dpos',{}),CW=[],ACC=ld('acc',''),LOGS=[],WS=ld('ws',{}),WSEL='clock',GO=null,BKF=true,FM=false,FKC=0,FK=ld('fk',{k:'F9',c:0,a:0,s:0}),TF='',SR=null,dbgUp=null,dT=0;
function dlog(l,m,s){LOGS.push({t:Date.now(),l,m:String(m),s:s||'os'});if(LOGS.length>500)LOGS.shift();if(dbgUp&&!dT)dT=setTimeout(()=>{dT=0;dbgUp&&dbgUp()},250)}
const fmt=a=>a.map(x=>{try{return typeof x=='object'&&x?(x instanceof Error?x.stack||x.message:JSON.stringify(x)):String(x)}catch(e){return String(x)}}).join(' ');
['log','info','warn','error','debug'].forEach(k=>{const o=console[k];console[k]=(...a)=>{o.apply(console,a);dlog(k=='debug'?'log':k,fmt(a))}});
